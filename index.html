<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clidex Editor</title>
<style>
  :root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;
    --blue:#58a6ff;--green:#238636;--greenh:#2ea043;--live:#3fb950;--red:#f85149;--yellow:#d29922;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit}
  #app{height:var(--app-h,100dvh);position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:flex;flex-direction:column}
  .grow{flex:1}
  .muted{color:var(--mute)} .sm{font-size:12px} .mono{font-family:var(--mono)}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
    background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
  .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:32px}
  .btn:active{filter:brightness(1.25)}
  .btn.primary{background:var(--green);border-color:rgba(240,246,252,.1);color:#fff}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:2px 10px;font-size:12px;min-height:26px}
  .btn.wide{width:100%;min-height:40px;font-size:15px}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .icon{display:grid;place-items:center;width:36px;height:36px;background:transparent;border:1px solid transparent;
    border-radius:6px;color:var(--mute);cursor:pointer;flex:none;padding:0}
  .icon:active{background:var(--bg3);color:var(--fg)}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;
    font-size:12px;font-weight:500;color:var(--mute);line-height:20px;white-space:nowrap}
  .pill.live{color:var(--live);border-color:#238636}
  .pill.build{color:var(--yellow);border-color:#9e6a03}
  .pill.fail{color:var(--red);border-color:#da3633}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

  .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .h1{font-size:20px;font-weight:600;margin:4px 0 12px}
  .box{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
  .box-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:13px;min-width:0}
  .box-head .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list{list-style:none;margin:0;padding:0}
  .list>li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
  .list>li:first-child{border-top:0}
  .list>li:active{background:var(--bg2)}
  .list>li.active{background:#1f6feb26;box-shadow:inset 3px 0 0 var(--blue)}
  .list .meta{flex:1;min-width:0}
  .list .nm{color:var(--blue);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .sub{color:var(--mute);font-size:12px}
  .empty{padding:32px 16px;text-align:center;color:var(--mute);cursor:default!important;display:block!important}
  .lang{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline}
  .tag{display:inline-block;width:18px;text-align:center;border-radius:4px;font:600 11px/18px var(--mono);margin-right:6px}
  .tag.M{color:var(--yellow);background:#d2992226}.tag.A{color:var(--live);background:#3fb95026}.tag.D{color:var(--red);background:#f8514926}
  code.h{font:12px var(--mono);background:var(--bg3);border-radius:4px;padding:1px 6px;color:var(--mute)}

  .name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--blue);
    font:inherit;font-size:16px;font-weight:600;padding:4px 2px;outline:none}
  .name:focus{border-bottom-color:var(--blue)}

  .workspace{flex:1;min-height:0;display:flex;flex-direction:column}
  .pane{display:none;flex:1;min-height:0;flex-direction:column;min-width:0}
  .workspace[data-pane=files] #filesPane,.workspace[data-pane=code] #codePane,.workspace[data-pane=preview] #previewPane{display:flex}
  #filesPane{overflow:auto}
  #filesPane .inner{padding:12px}
  .filebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;font-size:13px}

  /* власний редактор: textarea + підсвітка */
  .ed{flex:1;min-height:0;display:flex;position:relative;background:var(--bg);overflow:hidden}
  .gutter{flex:none;overflow:hidden;border-right:1px solid var(--line);color:#6e7681;text-align:right;user-select:none;-webkit-user-select:none}
  #nums{padding:10px 8px 120px;white-space:pre;font:13px/20px var(--mono)}
  .stack{position:relative;flex:1;min-width:0}
  #hl,#ta{position:absolute;inset:0;margin:0;border:0;padding:10px 12px 120px 12px;font:13px/20px var(--mono);
    font-variant-ligatures:none;tab-size:2;-moz-tab-size:2;white-space:pre;letter-spacing:0;overflow:auto;border-radius:0}
  #hl{overflow:hidden;pointer-events:none;color:var(--fg);padding-right:80px}
  #hl code{font:inherit}
  #ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#e6edf3;resize:none;outline:none;
    padding-right:40px;-webkit-appearance:none;appearance:none;z-index:1;-webkit-text-size-adjust:100%}
  #ta::selection{background:#1f6feb66;-webkit-text-fill-color:transparent}
  .t-c{color:#8b949e;font-style:italic}.t-s{color:#a5d6ff}.t-n{color:#79c0ff}.t-k{color:#ff7b72}.t-a{color:#79c0ff}
  .t-f{color:#d2a8ff}.t-tg{color:#7ee787}.t-at{color:#79c0ff}.t-p{color:#79c0ff}
  .keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--bg2);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
  .keys::-webkit-scrollbar{display:none}
  .keys button{flex:none;min-width:38px;height:36px;background:var(--bg3);border:1px solid var(--line);
    border-radius:6px;font:600 15px var(--mono);padding:0 10px;touch-action:manipulation}
  .keys button:active{background:var(--blue);color:#000}

  .urlbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
  .url{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;
    color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #frame{flex:1;min-height:0;width:100%;border:0;background:#fff}
  .console{flex:none;max-height:40%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
  .console-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:var(--bg2);font-size:12px;font-weight:600}
  #conLines{overflow:auto;padding:4px 10px;font:12px/1.5 var(--mono)}
  #conLines div{padding:2px 0;border-bottom:1px solid #21262d;white-space:pre-wrap;word-break:break-word}
  #conLines .error{color:var(--red)} #conLines .warn{color:var(--yellow)}
  #conCount{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}

  .bottomnav{display:flex;flex:none;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;background:none;border:0;
    color:var(--mute);font-size:11px;cursor:pointer}
  .bottomnav button.active{color:var(--fg);box-shadow:inset 0 2px 0 #f78166}
  body.kb .bottomnav{display:none}

  #viewer{position:absolute;inset:0;background:#fff}
  #viewer iframe{width:100%;height:100%;border:0}
  .badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;
    background:#161b22ee;color:#e6edf3;border:1px solid #30363d;border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;
    text-decoration:none;box-shadow:0 4px 14px #0006}
  .badge b{font-weight:600}
  .badge button{background:none;border:0;color:#8b949e;font-size:16px;line-height:1;padding:0 6px;cursor:pointer}

  .modal{position:fixed;inset:0;background:#010409b3;display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
  .sheet h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sheet h4{margin:16px 0 8px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .sheet label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mute)}
  .sheet p{margin:6px 0}
  .inp{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;
    font:inherit;font-size:16px;outline:none}
  .inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1f6feb55}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .row .btn{flex:1}
  .row.end{justify-content:flex-end}.row.end .btn{flex:none}
  .term{background:#000;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.6 var(--mono);color:#c9d1d9;
    max-height:190px;overflow:auto;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .term .arrow{color:var(--live)} .term .err{color:var(--red)}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .item .meta{flex:1;min-width:0}
  .item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;
    border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:1}

  .hero{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:14px;border:1px solid #1f6feb66;border-radius:8px;
    background:linear-gradient(135deg,#1f6feb22,#8957e522);cursor:pointer;width:100%;text-align:left}
  .hero:active{filter:brightness(1.15)}
  .hero .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#1f6feb;color:#fff;flex:none}
  .hero .ico svg{width:20px;height:20px}
  .hero b{display:block;font-size:15px}
  .hero span.s{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  textarea.inp{resize:vertical;min-height:120px;font-family:inherit;line-height:1.45}
  .binview{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
    background:conic-gradient(#161b22 25%,#0d1117 0 50%,#161b22 0 75%,#0d1117 0) 0 0/20px 20px}
  .binview img{max-width:100%;max-height:65%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#0008}
  .binview .info{color:var(--mute);font-size:12px;text-align:center;background:#0d1117dd;padding:6px 12px;border-radius:6px}
  .thumb{width:22px;height:22px;border-radius:4px;object-fit:cover;flex:none;border:1px solid var(--line)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .chip img{width:100%;height:100%;object-fit:cover;display:block}
  .chip button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:14px;line-height:20px;padding:0}
  .steps{margin-top:14px}
  .steps .st{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--mute)}
  .steps .st.on{color:var(--fg)} .steps .st.done{color:var(--live)}
  .steps .ck{width:14px;text-align:center;flex:none}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .diff{font:12px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:55vh;margin-top:8px}
  .diff div{white-space:pre;padding:0 8px;min-width:max-content} .diff .a{background:#3fb95022;color:#7ee787} .diff .d{background:#f8514922;color:#ffa198} .diff .gap{color:var(--muted);background:#ffffff08;text-align:center}
  .hit{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;color:var(--fg);font:inherit;cursor:pointer}
  .hit .f{font:600 12px var(--mono);color:#79c0ff} .hit .l{font:12px var(--mono);color:var(--muted);white-space:pre-wrap;word-break:break-all} .hit mark{background:#d2992244;color:var(--fg)}
  .avBtn{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;overflow:hidden;flex:none}
  .av0{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
  .tabbtn{background:none;border:0;color:var(--muted);font:600 14px system-ui;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn.active{color:var(--fg);border-bottom-color:#f78166}
  .card2{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg2)}
  .who{display:flex;align-items:center;gap:10px;min-width:0} .who b{cursor:pointer} .who .sm{color:var(--muted)}
  .lk{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font:600 12px system-ui;cursor:pointer}
  .lk.liked{color:#f85149;border-color:#f8514966} .lk.liked svg{fill:currentColor}
  .post p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
  #onb{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:center;padding:20px}
  .onb{width:100%;max-width:400px;text-align:center} .onb h1{font-size:28px;margin:8px 0} .onb .picbtn{border:0;background:none;padding:0;cursor:pointer;margin:6px auto 14px;display:block}
  .onb .inp{margin-top:10px;text-align:center} .onb .btn.wide{margin-top:14px;justify-content:center}
  .onb .link{background:none;border:0;color:#58a6ff;cursor:pointer;margin-top:14px;font:inherit}
  .warn{border:1px solid #9e6a03;background:#d2992214;color:var(--yellow);border-radius:6px;padding:8px 12px;font-size:13px;margin-top:10px}
  .ok{border:1px solid #238636;background:#23863614;color:var(--live);border-radius:6px;padding:8px 12px;font-size:13px;margin-top:10px}
  .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #cloudBtn{position:relative}
  #cloudBtn::after{content:'';position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--bg2)}
  #cloudBtn.s-ok::after{background:var(--live)} #cloudBtn.s-syncing::after{background:var(--yellow)} #cloudBtn.s-error::after{background:var(--red)}
  #cloudBtn.s-ok,#cloudBtn.s-syncing{color:var(--fg)}
  .slugrow{display:flex;align-items:stretch}
  .slugrow .pre{display:flex;align-items:center;padding:0 10px;background:var(--bg3);border:1px solid var(--line);border-right:0;border-radius:6px 0 0 6px;color:var(--mute);font:13px var(--mono);white-space:nowrap}
  .slugrow input{border-radius:0 6px 6px 0;min-width:0;font-family:var(--mono);font-size:14px}
  @media(min-width:900px){
    .workspace{flex-direction:row}
    .pane{display:flex!important}
    #filesPane{flex:0 0 290px;border-right:1px solid var(--line)}
    #codePane{flex:1;border-right:1px solid var(--line)}
    #previewPane{flex:1}
    .bottomnav{display:none}
    .modal{align-items:center}.sheet{border-radius:12px;padding-top:16px}.grab{display:none}
  }

  /* ===== v3: теми, стиль Render / GitHub, неонові анімації ===== */
  :root{--neon:#39ffa0;--neon2:#58a6ff;--neon3:#a371f7;--accent:#f78166;--ring:#1f6feb66;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
  :root[data-theme=light]{--bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--line:#d0d7de;--fg:#1f2328;--mute:#656d76;--muted:#656d76;
    --blue:#0969da;--green:#1f883d;--greenh:#1a7f37;--live:#1a7f37;--red:#cf222e;--yellow:#9a6700;
    --neon:#1a7f37;--neon2:#0969da;--neon3:#8250df;--accent:#fd8c73;--ring:#0969da55}
  html,body{font-family:var(--sans);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  :focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .inp:focus-visible{outline:0}
  .muted{color:var(--mute)}
  :root[data-theme=light] .t-c{color:#6e7781}:root[data-theme=light] .t-s{color:#0a3069}:root[data-theme=light] .t-n{color:#0550ae}
  :root[data-theme=light] .t-k{color:#cf222e}:root[data-theme=light] .t-a{color:#0550ae}:root[data-theme=light] .t-f{color:#8250df}
  :root[data-theme=light] .t-tg{color:#116329}:root[data-theme=light] .t-at{color:#0550ae}:root[data-theme=light] .t-p{color:#0550ae}
  :root[data-theme=light] #nums,:root[data-theme=light] .gutter{color:#8c959f}
  :root[data-theme=light] #ta{caret-color:#1f2328}
  :root[data-theme=light] #ta::selection{background:#0969da33}
  :root[data-theme=light] .diff .a{color:#116329;background:#2da44e22}:root[data-theme=light] .diff .d{color:#82071e;background:#cf222e1a}
  :root[data-theme=light] .modal{background:#1b1f2480}
  :root[data-theme=light] .hit mark{background:#fae17d}
  :root[data-theme=light] .binview{background:conic-gradient(#f6f8fa 25%,#fff 0 50%,#f6f8fa 0 75%,#fff 0) 0 0/20px 20px}
  :root[data-theme=light] .binview .info{background:#ffffffdd}
  :root[data-theme=light] #conLines div{border-bottom-color:#eaeef2}
  :root[data-theme=light] .keys button:active{color:#fff}
  :root[data-theme=light] #toast{box-shadow:0 8px 24px #1b1f2426}

  .brand{font-weight:700;letter-spacing:.1px;background:linear-gradient(90deg,var(--fg) 20%,var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .top{box-shadow:0 1px 0 rgba(1,4,9,.2)}
  .btn{transition:background .15s,border-color .15s,box-shadow .2s,transform .1s}
  @media (hover:hover){.btn:hover{border-color:var(--mute);background:color-mix(in srgb,var(--bg3) 85%,var(--fg))}.btn.primary:hover{background:var(--greenh)}.icon:hover{background:var(--bg3);color:var(--fg)}
    .list>li:hover{background:var(--bg2)}.card2:hover{border-color:var(--mute)}}
  .btn.danger:hover{border-color:var(--red)}
  .list>li,.card2{transition:background .15s,border-color .2s,box-shadow .25s}
  .list .nm{font-weight:600}
  .tabs{overflow-x:auto;scrollbar-width:none;white-space:nowrap}.tabs::-webkit-scrollbar{display:none}
  .tabbtn{transition:color .15s,border-color .2s;flex:none}

  Collab.es = null; Collab.id = ''; Collab.players = []; Collab.peers = {}; Collab.host = false; clearTimeout(Collab.sendT);
  if (!silent) { updateCollabUi(); collabCarets(); }
}
function updateCollabUi() { const b = $('#collabBtn'); if (b) { b.classList.toggle('primary', !!Collab.es); b.lastChild.textContent = Collab.es ? 'Онлайн · ' + Collab.players.length : 'Спільно'; } const m = $('#collabState'); if (m) m.textContent = Collab.es ? '● ' + Collab.players.length : ''; }
function openCollab() {
  if (!caps || !caps.mp) return showSheet(h('div', {}, h('h3', {}, 'Спільне редагування'), h('div', { class: 'warn' }, 'Потрібен сервер (server.js) — спільна кімната працює через нього.'), h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: closeSheet }, 'Закрити'))));
  if (Collab.es) {
    const link = BASE + '#collab=' + Collab.room;
    return showSheet(h('div', {}, h('h3', {}, '👥 Спільне редагування'), h('p', { class: 'muted sm' }, 'Кімната: ' + Collab.room + '. Усі зміни файлів з’являються в усіх учасників відразу, а їхні курсори видно в редакторі.'),
      h('div', {}, Collab.players.map(p => h('div', { class: 'item' }, h('span', { class: 'peerdot', style: 'background:' + peerColor(p.id) }), h('div', { class: 'meta' }, h('div', { class: 't', 'data-notr': '' }, p.name + (p.id === Collab.id ? ' (ви)' : '')))))),
      h('label', {}, 'Посилання-запрошення'), h('input', { class: 'inp mono', readonly: true, value: link, style: 'font-size:12px', onfocus: e => e.target.select() }),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => copyText(link) }, 'Копіювати посилання'), h('button', { class: 'btn danger', id: 'collabLeave', onclick: () => { collabLeave(); closeSheet(); toast('Ви вийшли з кімнати'); } }, 'Вийти з кімнати'))));
  }
  const code = h('input', { class: 'inp mono', id: 'collabCode', value: rid().slice(0, 6), maxlength: '30', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  showSheet(h('div', {}, h('h3', {}, '👥 Спільне редагування'), h('p', { class: 'muted sm' }, 'Редагуйте проєкт разом з друзями в реальному часі (до 6 людей): зміни й курсори видно відразу. Якщо кімната вже існує — відкриється її проєкт.'),
    h('label', {}, 'Код кімнати'), code, h('div', { class: 'row' }, h('button', { class: 'btn primary', id: 'collabGo', onclick: () => { const r = code.value.trim().replace(/[^A-Za-z0-9_-]/g, ''); if (!r) return toast('Введіть код кімнати'); closeSheet(); collabJoin(r, { proj: cur }); } }, 'Почати / приєднатися'), h('button', { class: 'btn', onclick: closeSheet }, 'Скасувати'))));
}

/* ================= власні шаблони ================= */
const TPL_KEY = 'clidex.tpls';
const loadTpls = () => { try { return JSON.parse(localStorage.getItem(TPL_KEY)) || []; } catch (e) { return []; } };
const saveTpls = l => { try { localStorage.setItem(TPL_KEY, JSON.stringify(l)); return true; } catch (e) { toast('Не вистачило місця для шаблону'); return false; } };
async function saveAsTemplate() {
  if (!cur) return; const nm = await ask('Назва шаблону', title(cur), 'Зберегти'); if (nm === null) return;
  const files = {}; Object.keys(cur.files).forEach(n => { const v = String(cur.files[n]); if (!v.startsWith('data:') || v.length < 150000) files[n] = v; });
  const l = loadTpls(); l.unshift({ id: rid(), name: nm || title(cur), t: Date.now(), files }); if (saveTpls(l.slice(0, 30))) toast('Шаблон збережено — він у «З шаблону»');
}

/* ----- перевірка від ботів при створенні профілю (proof-of-work) ----- */
async function powSolve() {
  if (!caps || !caps.pow) return undefined;
  const c = await api('GET', 'api/pow'); if (!c.bits) return undefined;
  if (!(window.crypto && crypto.subtle)) throw new Error('Для створення профілю потрібне безпечне (https) з’єднання');
  const enc = new TextEncoder(); let n = 0;
  for (;;) {
    for (let k = 0; k < 300; k++, n++) {
      const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(c.c + ':' + n)));
      let z = 0; for (const b of d) { if (b === 0) { z += 8; continue; } z += Math.clz32(b) - 24; break; }
      if (z >= c.bits) return { c: c.c, bits: c.bits, sig: c.sig, n };
    }
    await wait(0);
  }
}
function collabCaret() { if (!Collab.es || cur !== Collab.proj) return; const now = Date.now(); if (now - Collab.caretT < 150) return; Collab.caretT = now; collabSend({ t: 'c', n: curFile, c: ta.selectionStart }); }
['keyup', 'click'].forEach(ev => ta.addEventListener(ev, () => { hintsLater(); collabCaret(); }));
ta.addEventListener('scroll', collabCarets);
$('#gearBtn').onclick = openSettings; $('#bellBtn').onclick = openNotifications; $('#ownerBtn').onclick = () => openOwner();
$('#checkBtn').onclick = openSiteCheck; $('#collabBtn').onclick = openCollab; $('#tplSaveBtn').onclick = saveAsTemplate; $('#lintBtn').onclick = openLint;
i18nStart();

/* ================= маршрути ================= */
async function route() {
  const rm = location.hash.match(/^#repo=([\w-]+)/), cm = location.hash.match(/^#collab=([\w-]+)/), tm = location.hash.match(/^#tpl=(.+)$/);
  if (rm) { showView('home'); renderHome(); history.replaceState(null, '', location.pathname); setTimeout(() => openRepo(rm[1]), 60); return; }
  if (cm) { showView('home'); renderHome(); history.replaceState(null, '', location.pathname); setTimeout(() => collabJoin(cm[1], { proj: null }), 300); return; }
  if (tm) { showView('home'); renderHome(); history.replaceState(null, '', location.pathname); try { const d = JSON.parse(decodeURIComponent(escape(atob(tm[1])))); const l = loadTpls(); l.unshift({ id: rid(), name: d.n, t: Date.now(), files: d.f }); saveTpls(l.slice(0, 30)); toast('Шаблон додано — він у «З шаблону»'); } catch (e) { toast('Не вдалося відкрити шаблон'); } return; }
  const m = location.hash.match(/^#\/([^\/]*)\/(.+)$/);
  if (m) {
    showView('viewer');
    try {
      const d = await unpack(m[2]);
      document.title = d.n || 'Сайт';
      vFiles = d.f; vEntry = null; setFrame('vframe', buildDoc(d.f, { console: false, nav: true }));
      $('#badge').href = BASE;
    } catch (e) {
      setFrame('vframe', '<body style="font:16px sans-serif;padding:24px;background:#0d1117;color:#e6edf3">Не вдалося відкрити посилання. Воно пошкоджене або неповне.</body>');
    }
  } else { document.title = 'Clidex Editor'; showView('home'); renderHome(); }
}
$('#badgeX').onclick = e => { e.preventDefault(); e.stopPropagation(); $('#badge').hidden = true; };
addEventListener('popstate', () => { if (!$('#project').hidden || !location.hash) goHome(); });
addEventListener('hashchange', () => { if (location.hash.match(/^#(repo|collab|tpl)=/) || location.hash.startsWith('#/')) route(); });
const ready = loadStore();
const capsP = aiHealth().then(j => { caps = j; });
Promise.race([ready, wait(2500)]).then(route);
Promise.all([ready, capsP]).then(async () => {
  if (!$('#home').hidden) renderHome();
  updateCloudUi(); updateProfBtn(); ownerVerify().then(refreshLists); startNtPoll(); updateBell();
  if (caps && caps.mp) { try { mpLibText = await (await fetch(new URL('api/mp.js?scope=preview', BASE))).text(); if (cur && !$('#project').hidden) renderNow(); } catch (e) {} }
  if (!location.hash.startsWith('#/')) {
    if (syncCode) await loadMe();
    let onb = false; try { onb = !!localStorage.getItem(ONB_KEY); } catch (e) {}
    if (!onb && !me) openOnboarding(); else if (!onb && me) { try { localStorage.setItem(ONB_KEY, '1'); } catch (e) {} }
  }
  if (syncCode && !location.hash.startsWith('#/')) { if (caps && caps.sync) syncNow(false); else setSync('error', 'Сервер недоступний'); }
});
})();
