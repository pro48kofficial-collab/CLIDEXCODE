<style>

    }

  }
}

async function ownerGrant(nick) {
  const v = await ask('Скільки коінів видати: ' + nick + '? (від’ємне число — забрати)', '100', 'Видати'); if (v === null) return;

  try { const r = await ownerApi('POST', 'api/owner/grant', { nick, amount: n }); toast((n > 0 ? 'Видано ' + n : 'Забрано ' + (-n)) + ' 🪙. Баланс: ' + r.balance); } catch (e) { toast(e.message); }
}

  const m = location.hash.match(/^#\/([^\/]*)\/(.+)$/);

    showView('viewer');
    try {
      const d = await unpack(m[2]);

}
