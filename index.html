<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clidex Editor</title>
<style>
  :root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;
    --blue:#58a6ff;--green:#238636;--greenh:#2ea043;--live:#3fb950;--red:#f85149;--yellow:#d29922;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit}
  #app{height:var(--app-h,100dvh);position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:flex;flex-direction:column}
  .grow{flex:1}
  .muted{color:var(--mute)} .sm{font-size:12px} .mono{font-family:var(--mono)}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
    background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
  .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:32px}
  .btn:active{filter:brightness(1.25)}
  .btn.primary{background:var(--green);border-color:rgba(240,246,252,.1);color:#fff}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:2px 10px;font-size:12px;min-height:26px}
  .btn.wide{width:100%;min-height:40px;font-size:15px}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .icon{display:grid;place-items:center;width:36px;height:36px;background:transparent;border:1px solid transparent;
    border-radius:6px;color:var(--mute);cursor:pointer;flex:none;padding:0}
  .icon:active{background:var(--bg3);color:var(--fg)}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;
    font-size:12px;font-weight:500;color:var(--mute);line-height:20px;white-space:nowrap}
  .pill.live{color:var(--live);border-color:#238636}
  .pill.build{color:var(--yellow);border-color:#9e6a03}
  .pill.fail{color:var(--red);border-color:#da3633}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

  .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .h1{font-size:20px;font-weight:600;margin:4px 0 12px}
  .box{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
  .box-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:13px;min-width:0}
  .box-head .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list{list-style:none;margin:0;padding:0}
  .list>li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
  .list>li:first-child{border-top:0}
  .list>li:active{background:var(--bg2)}
  .list>li.active{background:#1f6feb26;box-shadow:inset 3px 0 0 var(--blue)}
  .list .meta{flex:1;min-width:0}
  .list .nm{color:var(--blue);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .sub{color:var(--mute);font-size:12px}
  .empty{padding:32px 16px;text-align:center;color:var(--mute);cursor:default!important;display:block!important}
  .lang{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline}
  .tag{display:inline-block;width:18px;text-align:center;border-radius:4px;font:600 11px/18px var(--mono);margin-right:6px}
  .tag.M{color:var(--yellow);background:#d2992226}.tag.A{color:var(--live);background:#3fb95026}.tag.D{color:var(--red);background:#f8514926}
  code.h{font:12px var(--mono);background:var(--bg3);border-radius:4px;padding:1px 6px;color:var(--mute)}

  .name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--blue);
    font:inherit;font-size:16px;font-weight:600;padding:4px 2px;outline:none}
  .name:focus{border-bottom-color:var(--blue)}

  .workspace{flex:1;min-height:0;display:flex;flex-direction:column}
  .pane{display:none;flex:1;min-height:0;flex-direction:column;min-width:0}
  .workspace[data-pane=files] #filesPane,.workspace[data-pane=code] #codePane,.workspace[data-pane=preview] #previewPane{display:flex}
  #filesPane{overflow:auto}
  #filesPane .inner{padding:12px}
  .filebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;font-size:13px}

  /* власний редактор: textarea + підсвітка */
  .ed{flex:1;min-height:0;display:flex;position:relative;background:var(--bg);overflow:hidden}
  .gutter{flex:none;overflow:hidden;border-right:1px solid var(--line);color:#6e7681;text-align:right;user-select:none;-webkit-user-select:none}
  #nums{padding:10px 8px 120px;white-space:pre;font:13px/20px var(--mono)}
  .stack{position:relative;flex:1;min-width:0}
  #hl,#ta{position:absolute;inset:0;margin:0;border:0;padding:10px 12px 120px 12px;font:13px/20px var(--mono);
    font-variant-ligatures:none;tab-size:2;-moz-tab-size:2;white-space:pre;letter-spacing:0;overflow:auto;border-radius:0}
  #hl{overflow:hidden;pointer-events:none;color:var(--fg);padding-right:80px}
  #hl code{font:inherit}
  #ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#e6edf3;resize:none;outline:none;
    padding-right:40px;-webkit-appearance:none;appearance:none;z-index:1;-webkit-text-size-adjust:100%}
  #ta::selection{background:#1f6feb66;-webkit-text-fill-color:transparent}
  .t-c{color:#8b949e;font-style:italic}.t-s{color:#a5d6ff}.t-n{color:#79c0ff}.t-k{color:#ff7b72}.t-a{color:#79c0ff}
  .t-f{color:#d2a8ff}.t-tg{color:#7ee787}.t-at{color:#79c0ff}.t-p{color:#79c0ff}
  .keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--bg2);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
  .keys::-webkit-scrollbar{display:none}
  .keys button{flex:none;min-width:38px;height:36px;background:var(--bg3);border:1px solid var(--line);
    border-radius:6px;font:600 15px var(--mono);padding:0 10px;touch-action:manipulation}
  .keys button:active{background:var(--blue);color:#000}

  .urlbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
  .url{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;
    color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #frame{flex:1;min-height:0;width:100%;border:0;background:#fff}
  .console{flex:none;max-height:40%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
  .console-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:var(--bg2);font-size:12px;font-weight:600}
  #conLines{overflow:auto;padding:4px 10px;font:12px/1.5 var(--mono)}
  #conLines div{padding:2px 0;border-bottom:1px solid #21262d;white-space:pre-wrap;word-break:break-word}
  #conLines .error{color:var(--red)} #conLines .warn{color:var(--yellow)}
  #conCount{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}

  .bottomnav{display:flex;flex:none;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;background:none;border:0;
    color:var(--mute);font-size:11px;cursor:pointer}
  .bottomnav button.active{color:var(--fg);box-shadow:inset 0 2px 0 #f78166}
  body.kb .bottomnav{display:none}

  #viewer{position:absolute;inset:0;background:#fff}
  #viewer iframe{width:100%;height:100%;border:0}
  .badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;
    background:#161b22ee;color:#e6edf3;border:1px solid #30363d;border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;
    text-decoration:none;box-shadow:0 4px 14px #0006}
  .badge b{font-weight:600}
  .badge button{background:none;border:0;color:#8b949e;font-size:16px;line-height:1;padding:0 6px;cursor:pointer}

  .modal{position:fixed;inset:0;background:#010409b3;display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
  .sheet h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sheet h4{margin:16px 0 8px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .sheet label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mute)}
  .sheet p{margin:6px 0}
  .inp{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;
    font:inherit;font-size:16px;outline:none}
  .inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1f6feb55}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .row .btn{flex:1}
  .row.end{justify-content:flex-end}.row.end .btn{flex:none}
  .term{background:#000;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.6 var(--mono);color:#c9d1d9;
    max-height:190px;overflow:auto;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .term .arrow{color:var(--live)} .term .err{color:var(--red)}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .item .meta{flex:1;min-width:0}
  .item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;
    border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:1}

  @media(min-width:900px){
    .workspace{flex-direction:row}
    .pane{display:flex!important}
    #filesPane{flex:0 0 290px;border-right:1px solid var(--line)}
    #codePane{flex:1;border-right:1px solid var(--line)}
    #previewPane{flex:1}
    .bottomnav{display:none}
    .modal{align-items:center}.sheet{border-radius:12px;padding-top:16px}.grab{display:none}
  }
</style>
</head>
<body>
<div id="app">

  <!-- Головна: список проєктів -->
  <section id="home" class="view">
    <header class="top">
      <span class="logo" data-ic="code"></span><strong>Clidex Editor</strong>
      <span class="grow"></span>
      <button class="btn primary" id="newBtn"><span data-ic="plus"></span>Новий</button>
    </header>
    <div class="scroll"><div class="wrap">
      <h1 class="h1">Ваші проєкти</h1>
      <input class="inp" id="q" placeholder="Знайти проєкт…" autocomplete="off" style="margin-bottom:12px">
      <div class="box"><ul class="list" id="projList"></ul></div>
    </div></div>
  </section>

  <!-- Проєкт -->
  <section id="project" class="view" hidden>
    <header class="top">
      <button class="icon" id="back" aria-label="Назад" data-ic="back"></button>
      <input class="name" id="nameInput" maxlength="60" placeholder="Назва сайту" autocomplete="off" spellcheck="false" aria-label="Назва сайту">
      <button class="icon" id="commitsBtn" aria-label="Коміти" data-ic="commit"></button>
      <button class="btn primary" id="deployBtn"><span data-ic="up"></span>Деплой</button>
    </header>
    <div class="workspace" id="workspace" data-pane="files">
      <aside class="pane" id="filesPane"><div class="inner">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span class="pill"><span data-ic="branch"></span>main</span>
          <span class="grow"></span>
          <button class="btn sm" id="commitCount"><span data-ic="clock"></span><span id="commitCountTxt"></span></button>
        </div>
        <div class="box">
          <div class="box-head" id="commitBar"></div>
          <ul class="list" id="fileList"></ul>
        </div>
        <div class="row"><button class="btn" id="addFile"><span data-ic="plus"></span>Новий файл</button></div>
      </div></aside>
      <div class="pane" id="codePane">
        <div class="filebar"><span data-ic="file"></span><strong id="curFile"></strong><span class="grow"></span><span class="muted sm" id="saveState">Збережено</span></div>
        <div class="ed" id="ed">
          <div class="gutter" id="gutter"><div id="nums"></div></div>
          <div class="stack">
            <pre id="hl" aria-hidden="true"><code id="hlc"></code></pre>
            <textarea id="ta" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Код"></textarea>
          </div>
        </div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="pane" id="previewPane">
        <div class="urlbar">
          <button class="icon" id="reload" aria-label="Оновити" data-ic="refresh"></button>
          <div class="url" id="urlText"></div>
          <button class="icon" id="conBtn" aria-label="Консоль"><span data-ic="term"></span><span id="conCount" hidden></span></button>
          <button class="icon" id="openTab" aria-label="Відкрити у вкладці" data-ic="ext"></button>
        </div>
        <iframe id="frame" title="Перегляд" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        <div class="console" id="console" hidden>
          <div class="console-head"><span>Консоль</span><button class="btn sm" id="conClear">Очистити</button></div>
          <div id="conLines"></div>
        </div>
      </div>
    </div>
    <nav class="bottomnav">
      <button data-go="files" class="active"><span data-ic="folder"></span>Файли</button>
      <button data-go="code"><span data-ic="code"></span>Код</button>
      <button data-go="preview"><span data-ic="play"></span>Перегляд</button>
    </nav>
  </section>

  <!-- Сайт за посиланням -->
  <section id="viewer" hidden>
    <iframe id="vframe" title="Сайт" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <a class="badge" id="badge" href="#"><span data-ic="code"></span><b>Clidex Editor</b><button id="badgeX" aria-label="Закрити">×</button></a>
  </section>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
</div>

<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'clidex.projects.v1';
const BASE = location.href.split('#')[0];

/* ================= іконки ================= */
const IC = {
  code:'<path d="M5.5 4L1.5 8l4 4M10.5 4l4 4-4 4"/>', plus:'<path d="M8 2.5v11M2.5 8h11"/>',
  back:'<path d="M10 2.5L4.5 8 10 13.5"/>', play:'<path d="M4.5 3v10l8-5z"/>',
  file:'<path d="M4 1.5h5l3.5 3.5v9.5H4z"/><path d="M9 1.5V5h3.5"/>', folder:'<path d="M1.5 3.5h4.5l1.5 1.5h7v8h-13z"/>',
  refresh:'<path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/>', term:'<path d="M2 3.5h12v9H2zM4.5 6.5l2 1.5-2 1.5M8 10h3"/>',
  ext:'<path d="M9 2.5h4.5V7M13.5 2.5l-6 6M12 9.5v4H2.5V4h4"/>', trash:'<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/>',
  pen:'<path d="M3 13l.5-3L11 2.5 13.5 5 6 12.5z"/>', repo:'<path d="M3 2.5h8.5A1.5 1.5 0 0 1 13 4v9.5H4.5A1.5 1.5 0 0 1 3 12z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H13"/>',
  commit:'<circle cx="8" cy="8" r="3"/><path d="M1.5 8H5M11 8h3.5"/>',
  branch:'<circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5.5" r="1.5"/><path d="M4.5 5v6M11.5 7c0 3-7 2-7 4"/>',
  up:'<path d="M8 11V2.5M4.5 6L8 2.5 11.5 6M2.5 13.5h11"/>', clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 16 16" aria-hidden="true">' + IC[n] + '</svg>';
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = ic(e.dataset.ic) + e.innerHTML; });

/* ================= утиліти ================= */
function setFrame(id, html) {
  const old = document.getElementById(id), f = old.cloneNode(false);
  f.removeAttribute('srcdoc'); old.replaceWith(f); f.srcdoc = html; return f;
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }
const wait = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(16).slice(2, 9);
const TR = {а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ю:'iu',я:'ia',ы:'y',э:'e',ё:'e'};
function slug(n) {
  const s = (n || '').toLowerCase().split('').map(c => TR[c] !== undefined ? TR[c] : c).join('')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return s || 'site';
}
const title = p => (p.name || '').trim() || 'Без назви';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'щойно'; if (s < 3600) return Math.floor(s / 60) + ' хв тому';
  if (s < 86400) return Math.floor(s / 3600) + ' год тому';
  return new Date(t).toLocaleDateString('uk-UA');
}
const ext = n => n.split('.').pop().toLowerCase();
const isWide = () => matchMedia('(min-width:900px)').matches;

/* висота під клавіатуру */
let maxH = 0;
function fit() {
  const vv = window.visualViewport, hh = vv ? vv.height : innerHeight;
  maxH = Math.max(maxH, hh);
  document.documentElement.style.setProperty('--app-h', hh + 'px');
  document.body.classList.toggle('kb', hh < maxH * 0.75);
  if (vv && vv.offsetTop) window.scrollTo(0, 0);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
addEventListener('resize', fit);
addEventListener('orientationchange', () => { maxH = 0; setTimeout(fit, 250); });
fit();

/* ================= сховище та модель ================= */
let projects = [];
try { projects = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(projects)); return true; } catch (e) { return false; } }

function starter(name) {
  return {

    'style.css': 'body {\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  background: #0d1117;\n  color: #e6edf3;\n  font-family: system-ui, sans-serif;\n}\n\n.card {\n  text-align: center;\n  padding: 32px;\n  border: 1px solid #30363d;\n  border-radius: 12px;\n  background: #161b22;\n}\n\nbutton {\n  padding: 10px 20px;\n  border: 0;\n  border-radius: 8px;\n  background: #238636;\n  color: #fff;\n  font-size: 16px;\n}\n',

  };
}
function ensureGit(p) {
  if (!p.commits || !p.commits.length) p.commits = [{ id: rid(), msg: 'Initial commit', t: p.updated || Date.now(), files: Object.assign({}, p.files) }];
  if (!p.deploys) p.deploys = [];
}
function changes(p) {
  const head = p.commits[0].files, out = [];
  Object.keys(p.files).forEach(n => { if (head[n] === undefined) out.push({ n, t: 'A' }); else if (head[n] !== p.files[n]) out.push({ n, t: 'M' }); });
  Object.keys(head).forEach(n => { if (p.files[n] === undefined) out.push({ n, t: 'D' }); });
  return out;
}
function defaultMsg(ch) {
  if (!ch.length) return '';
  if (ch.length === 1) return ({ A: 'Add ', M: 'Update ', D: 'Delete ' })[ch[0].t] + ch[0].n;
  return 'Update ' + ch.length + ' files';
}
function commit(p, msg) {
  const ch = changes(p); if (!ch.length) return null;
  const c = { id: rid(), msg: msg || defaultMsg(ch), t: Date.now(), files: Object.assign({}, p.files) };
  p.commits.unshift(c);
  const keep = new Set(p.deploys.slice(0, 10).map(d => d.commit));
  p.commits = p.commits.filter((x, i) => i < 40 || keep.has(x.id));
  p.updated = Date.now(); persist(); return c;
}
const findCommit = (p, id) => p.commits.find(c => c.id === id);
function topLang(files) {
  const sz = {}; Object.keys(files).forEach(n => { sz[ext(n)] = (sz[ext(n)] || 0) + files[n].length; });
  const map = { html: ['HTML', '#e34c26'], htm: ['HTML', '#e34c26'], css: ['CSS', '#a371f7'], js: ['JavaScript', '#f1e05a'], mjs: ['JavaScript', '#f1e05a'] };
  let best = null, bs = -1; for (const k in sz) if (map[k] && sz[k] > bs) { bs = sz[k]; best = map[k]; }
  return best;
}

/* ================= збірка сайту ================= */
function shim(o) {
  try { window.localStorage.getItem('x'); } catch (e) {
    try {
      var s = {};
      Object.defineProperty(window, 'localStorage', { value: {
        getItem: function (k) { return k in s ? s[k] : null; }, setItem: function (k, v) { s[k] = String(v); },
        removeItem: function (k) { delete s[k]; }, clear: function () { s = {}; }
      }});
    } catch (e2) {}
  }
  if (!o.console) return;
  function fmt(x) { try { if (typeof x === 'string') return x; if (x instanceof Error) return x.stack || x.message; var r = JSON.stringify(x); return r === undefined ? String(x) : r; } catch (e) { return String(x); } }
  function send(t, a) { try { parent.postMessage({ clx: 1, t: t, a: a.map(fmt) }, '*'); } catch (e) {} }
  ['log', 'info', 'warn', 'error'].forEach(function (m) {
    var o2 = console[m];
    console[m] = function () { send(m, [].slice.call(arguments)); o2.apply(console, arguments); };
  });
  addEventListener('error', function (e) { send('error', [e.message + (e.lineno ? ' (рядок ' + e.lineno + ')' : '')]); });
  addEventListener('unhandledrejection', function (e) { send('error', ['Promise: ' + (e.reason && e.reason.message || e.reason)]); });
}
function buildDoc(files, opts) {
  opts = opts || {};
  const norm = p => p.replace(/^\.?\//, '');
  const entry = files['index.html'] != null ? 'index.html' : Object.keys(files).find(k => /\.html?$/i.test(k));
  let html = entry ? files[entry] : '<body style="font:16px sans-serif;padding:24px;color:#555">Додайте файл index.html</body>';
  html = html.replace(/<link\b[^>]*>/gi, m => {
    const hr = (m.match(/href\s*=\s*["']([^"']+)["']/i) || [])[1], k = hr && norm(hr);
    return k && /\.css$/i.test(k) && files[k] != null ? '<style>' + files[k] + '</style>' : m;
  });
  html = html.replace(/<script\b([^>]*)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (m, a, s, b) => {
    const k = norm(s);
    return files[k] != null ? '<script' + a + b + '>' + files[k].replace(/<\/script/gi, '<\\/script') + '<\/script>' : m;
  });
  const inj = '<script>(' + shim.toString() + ')(' + JSON.stringify({ console: !!opts.console }) + ')<\/script>';
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + inj) : inj + html;
}

/* ================= посилання ================= */
function b64u(u8) {
  let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u;
}
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return 'z' + b64u(new Uint8Array(buf));
  }
  return 'r' + b64u(bytes);
}
async function unpack(s) {
  let bytes = unb64u(s.slice(1));
  if (s[0] === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function makeLink(files, name) { return BASE + '#/' + slug(name) + '/' + await pack({ n: name, f: files }); }
async function copyText(t, inp) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { if (inp) { inp.focus(); inp.select(); } try { document.execCommand('copy'); } catch (e2) {} }
  toast('Скопійовано');
}
function download(files, name) {
  const url = URL.createObjectURL(new Blob([buildDoc(files, { console: false })], { type: 'text/html' }));
  const a = h('a', { href: url, download: slug(name) + '.html', style: 'display:none' });
  document.body.append(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}

function ask(ttl, value, ok, ph) {

/* ================= редактор коду ================= */
function hlJS(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|`(?:\\[\s\S]|[^`\\])*`?)|(\b0x[\da-fA-F]+\b|\b\d+(?:\.\d+)?\b)|(\b(?:const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|import|export|from|default|async|await|try|catch|finally|throw|typeof|instanceof|in|of|this|super|delete|void|yield|static)\b)|(\b(?:true|false|null|undefined|NaN|Infinity)\b)|(\b[A-Za-z_$][\w$]*(?=\s*\())/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const c = m[1] !== undefined ? 'c' : m[2] !== undefined ? 's' : m[3] !== undefined ? 'n' : m[4] !== undefined ? 'k' : m[5] !== undefined ? 'a' : 'f';
    out += '<span class="t-' + c + '">' + esc(m[0]) + '</span>'; last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function hlCSS(src) {
  const re = /(\/\*[\s\S]*?(?:\*\/|$))|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(@[\w-]+)|([{};])|(#[\w-]+)|(-?(?:\d+\.?\d*|\.\d+)(?:px|em|rem|%|vh|vw|vmin|vmax|ms|s|deg|fr|ch)?)|([A-Za-z_-][\w-]*)|(\.[A-Za-z_-][\w-]*)|(::?[A-Za-z-]+)/g;
  const stack = []; let start = 0, out = '', last = 0, m;
  const sp = (c, s) => '<span class="t-' + c + '">' + esc(s) + '</span>';
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const decl = stack.length && stack[stack.length - 1];
    if (m[1] !== undefined) out += sp('c', m[0]);
    else if (m[2] !== undefined) out += sp('s', m[0]);
    else if (m[3] !== undefined) out += sp('k', m[0]);
    else if (m[4] !== undefined) {
      if (m[0] === '{') stack.push(!/^\s*@(media|supports|keyframes|-webkit-keyframes|layer|container|document)/i.test(src.slice(start, m.index)));
      else if (m[0] === '}') stack.pop();
      start = m.index + 1; out += esc(m[0]);
    }
    else if (m[5] !== undefined) out += sp(decl ? 'n' : 'f', m[0]);
    else if (m[6] !== undefined) out += sp('n', m[0]);
    else if (m[7] !== undefined) out += decl ? (/^\s*:/.test(src.slice(re.lastIndex)) ? sp('p', m[0]) : esc(m[0])) : sp('tg', m[0]);
    else if (m[8] !== undefined) out += sp('f', m[0]);
    else out += decl ? esc(m[0]) : sp('k', m[0]);
  }
  return out + esc(src.slice(last));
}
function hlAttrs(a) {
  const re = /([^\s"'<>\/=]+)(\s*=\s*)?("[^"]*"?|'[^']*'?|[^\s"'<>]+)?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(a))) {
    out += esc(a.slice(last, m.index)) + '<span class="t-at">' + esc(m[1]) + '</span>' + (m[2] ? esc(m[2]) : '') + (m[3] ? '<span class="t-s">' + esc(m[3]) + '</span>' : '');
    last = re.lastIndex;
  }
  return out + esc(a.slice(last));
}
function hlMarkup(s) {
  const re = /(<!--[\s\S]*?(?:-->|$))|(<![A-Za-z][^>]*>?)|(<\/?)([A-Za-z][\w:-]*)((?:\s+[^\s"'<>\/=]+(?:\s*=\s*(?:"[^"]*"?|'[^']*'?|[^\s"'<>]+))?)*)(\s*\/?>?)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    if (m[1] !== undefined || m[2] !== undefined) out += '<span class="t-c">' + esc(m[0]) + '</span>';
    else out += esc(m[3]) + '<span class="t-tg">' + esc(m[4]) + '</span>' + hlAttrs(m[5]) + esc(m[6]);

}

const ta = $('#ta'), hl = $('#hl'), hlc = $('#hlc'), gutter = $('#gutter'), nums = $('#nums');

  caret(p) { ta.setSelectionRange(p, p); },

const VOID = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;

    if ((pairs[before] && after === pairs[before]) || tagOpen) {

    } else if (pairs[before]) Ed.insert('\n' + ind + '  ');

let dirty = true, saveT, filesT;
function setPane(p) {
  $('#workspace').dataset.pane = p;
  document.querySelectorAll('.bottomnav button').forEach(b => b.classList.toggle('active', b.dataset.go === p));
  if (p === 'preview' && dirty) renderNow();

}

function openProject(id) {
  cur = projects.find(p => p.id === id); if (!cur) return;
  ensureGit(cur);
  showView('project'); history.pushState({ p: 1 }, '');
  $('#nameInput').value = cur.name;
  const first = cur.files['index.html'] != null ? 'index.html' : Object.keys(cur.files)[0];

}

  if (!stay && !isWide()) setPane('code');
}
Ed.onChange = v => {
  if (!cur) return;
  cur.files[curFile] = v; dirty = true; touch(); scheduleRender();
  clearTimeout(filesT); filesT = setTimeout(renderFiles, 350);
};
function touch() {
  cur.updated = Date.now(); $('#saveState').textContent = 'Збереження…';
  clearTimeout(saveT); saveT = setTimeout(() => { $('#saveState').textContent = persist() ? 'Збережено' : 'Не вдалося зберегти'; }, 500);
}
function renderFiles() {
  if (!cur) return;
  const ch = changes(cur), tg = {}; ch.forEach(c => { tg[c.n] = c.t; });
  const head = cur.commits[0];
  $('#commitBar').replaceChildren(
    h('span', { class: 'muted', html: ic('commit') }), h('span', { class: 'msg' }, head.msg),
    h('code', { class: 'h' }, head.id), h('span', { class: 'muted sm' }, ago(head.t)));
  $('#commitCountTxt').textContent = cur.commits.length + (ch.length ? ' · ' + ch.length + ' змін' : '');
  const ul = $('#fileList'); ul.replaceChildren();
  Object.keys(cur.files).forEach(n => {
    ul.append(h('li', { class: n === curFile ? 'active' : '', onclick: () => openFile(n) },
      h('span', { class: 'muted', html: ic('file') }),
      h('div', { class: 'meta' }, h('div', { class: 'nm', style: 'color:var(--fg);font-weight:500' }, n)),
      tg[n] ? h('span', { class: 'tag ' + tg[n], style: 'margin:0' }, tg[n]) : null,
      h('button', { class: 'icon', 'aria-label': 'Перейменувати', html: ic('pen'), onclick: e => { e.stopPropagation(); renameFile(n); } }),
      h('button', { class: 'icon', 'aria-label': 'Видалити', html: ic('trash'), onclick: e => { e.stopPropagation(); deleteFile(n); } })));
  });
}
const cleanName = v => (v || '').trim().replace(/\s+/g, '-').replace(/[\\/]/g, '');
$('#addFile').onclick = async () => {
  const n = cleanName(await ask('Назва нового файлу', '', 'Створити', 'about.html, app.js, style.css'));
  if (!n) return;
  if (cur.files[n] != null) return toast('Такий файл уже є');
  cur.files[n] = ''; touch(); dirty = true; openFile(n);
};
async function renameFile(old) {
  const n = cleanName(await ask('Нова назва файлу', old, 'Зберегти'));
  if (!n || n === old) return;
  if (cur.files[n] != null) return toast('Такий файл уже є');
  const nf = {}; Object.keys(cur.files).forEach(k => { nf[k === old ? n : k] = cur.files[k]; });
  cur.files = nf; if (curFile === old) { curFile = n; Ed.load(cur.files[n], n); $('#curFile').textContent = n; }
  touch(); renderFiles(); dirty = true; scheduleRender();
}
async function deleteFile(n) {
  if (Object.keys(cur.files).length < 2) return toast('Має лишитися хоча б один файл');
  if (!(await confirmBox('Видалити «' + n + '»?', 'Файл можна повернути, відновивши попередній коміт.', 'Видалити', true))) return;
  delete cur.files[n];
  if (curFile === n) openFile(Object.keys(cur.files)[0], true);
  touch(); renderFiles(); dirty = true; scheduleRender();
}
$('#nameInput').addEventListener('input', e => { cur.name = e.target.value; touch(); updateUrl(); });
function goHome() { cur = null; showView('home'); renderHome(); }
$('#back').onclick = () => { goHome(); if (history.state && history.state.p) history.back(); };

/* ================= перегляд ================= */
let renderT, errs = 0;
function updateUrl() { if (cur) $('#urlText').textContent = slug(title(cur)) + '/index.html'; }
function scheduleRender() { clearTimeout(renderT); renderT = setTimeout(() => { if (isWide() || $('#workspace').dataset.pane === 'preview') renderNow(); }, 450); }
function renderNow() { if (!cur) return; dirty = false; clearConsole(); setFrame('frame', buildDoc(cur.files, { console: true })); }
$('#reload').onclick = renderNow;
$('#openTab').onclick = () => {
  const url = URL.createObjectURL(new Blob([buildDoc(cur.files, { console: false })], { type: 'text/html' }));
  const w = window.open(url, '_blank'); if (!w) toast('Браузер заблокував вікно — дозвольте спливні вікна');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
};
function clearConsole() { errs = 0; $('#conLines').replaceChildren(); $('#conCount').hidden = true; }
$('#conBtn').onclick = () => { const c = $('#console'); c.hidden = !c.hidden; };
$('#conClear').onclick = clearConsole;
addEventListener('message', e => {
  const d = e.data; if (!d || !d.clx || e.source !== $('#frame').contentWindow) return;
  $('#conLines').append(h('div', { class: d.t }, d.a.join(' ')));
  if (d.t === 'error') { errs++; $('#conCount').textContent = errs; $('#conCount').hidden = false; }
  const l = $('#conLines'); l.scrollTop = l.scrollHeight;
});

/* ================= коміти (як GitHub) ================= */
function openCommits() {
  const ch = changes(cur), dm = defaultMsg(ch);
  const msg = h('input', { class: 'inp', placeholder: dm || 'Опис коміту', maxlength: '80', autocomplete: 'off' });
  const doCommit = () => {
    const c = commit(cur, msg.value.trim() || dm);
    if (c) { toast('Коміт ' + c.id + ' створено'); renderFiles(); openCommits(); }
  };
  const list = h('div', {});
  cur.commits.forEach((c, i) => {
    list.append(h('div', { class: 'item' },
      h('span', { class: 'muted', html: ic('commit') }),
      h('div', { class: 'meta' }, h('div', { class: 't' }, c.msg),
        h('div', { class: 'muted sm' }, [h('code', { class: 'h' }, c.id), ' · ' + ago(c.t) + (i === 0 ? ' · HEAD' : '')])),
      i === 0 && !ch.length ? null : h('button', { class: 'btn sm', onclick: async () => {
        if (!(await confirmBox('Відновити коміт ' + c.id + '?', 'Поточні файли буде замінено файлами з цього коміту. Незакомічені зміни зникнуть.', 'Відновити'))) return;
        cur.files = Object.assign({}, c.files); touch(); dirty = true;
        openFile(cur.files[curFile] != null ? curFile : Object.keys(cur.files)[0], true); renderFiles(); scheduleRender(); toast('Відновлено ' + c.id);
      } }, 'Відновити')));
  });
  showSheet(h('div', {},
    h('h3', {}, [h('span', { html: ic('commit') }), 'Коміти']),
    h('label', {}, ch.length ? 'Змінені файли' : 'Зміни'),
    ch.length ? h('div', {}, ch.map(c => h('div', { class: 'sm', style: 'padding:2px 0' }, [h('span', { class: 'tag ' + c.t }, c.t), c.n])))
              : h('p', { class: 'muted sm' }, 'Немає незакомічених змін.'),
    h('label', {}, 'Опис коміту'), msg,
    h('div', { class: 'row' }, h('button', { class: 'btn primary', disabled: !ch.length, onclick: doCommit }, 'Закомітити зміни')),
    h('h4', {}, 'Історія (' + cur.commits.length + ')'), list));
}
$('#commitsBtn').onclick = openCommits; $('#commitCount').onclick = openCommits;

/* ================= деплой (як Render) ================= */
let deploying = false;
function openDeploy() {
  const p = cur, root = h('div', {});
  const nameInp = h('input', { class: 'inp', value: p.name, maxlength: '60', placeholder: 'Назва сайту', autocomplete: 'off' });
  const urlInp = h('input', { class: 'inp mono', readonly: true, style: 'font-size:12px', placeholder: 'Посилання з’явиться після першого деплою', onfocus: e => e.target.select() });
  const openA = h('a', { class: 'btn', target: '_blank', rel: 'noopener' }, 'Відкрити');
  const pillBox = h('span', {}), listBox = h('div', {}), term = h('div', { class: 'term', hidden: true });
  const deployBtn = h('button', { class: 'btn primary wide', onclick: run }, [h('span', { html: ic('up') }), 'Деплой']);
  const copyBtn = h('button', { class: 'btn', onclick: () => urlInp.value && copyText(urlInp.value, urlInp) }, 'Копіювати');
  const dlBtn = h('button', { class: 'btn', onclick: () => {
    const d = p.deploys[0], c = d && findCommit(p, d.commit); download(c ? c.files : p.files, title(p));
  } }, 'Завантажити .html');
  const shareBtn = navigator.share ? h('button', { class: 'btn', onclick: () => urlInp.value && navigator.share({ title: title(p), url: urlInp.value }).catch(() => {}) }, 'Надіслати') : null;
  let tk = 0;
  function pill(kind, text) { pillBox.replaceChildren(h('span', { class: 'pill ' + kind }, [h('span', { class: 'dot' }), text])); }
  async function refresh() {
    const my = ++tk, live = p.deploys[0];
    if (!deploying) pill(live ? 'live' : '', live ? 'Live · ' + ago(live.t) : 'Не опубліковано');
    const ch = changes(p);
    deployBtn.lastChild.textContent = ch.length ? 'Закомітити й задеплоїти (' + ch.length + ')' : 'Задеплоїти останній коміт';
    listBox.replaceChildren();
    const rows = p.deploys.slice(0, 5);
    const links = await Promise.all(rows.map(d => { const c = findCommit(p, d.commit); return c ? makeLink(c.files, title(p)) : Promise.resolve(''); }));
    if (my !== tk) return;
    if (links[0]) { urlInp.value = links[0]; openA.href = links[0]; } else { urlInp.value = ''; openA.removeAttribute('href'); }
    [copyBtn, dlBtn, shareBtn].forEach(b => { if (b) b.toggleAttribute('disabled', !links[0]); });
    openA.style.opacity = links[0] ? '' : '.5'; openA.style.pointerEvents = links[0] ? '' : 'none';
    rows.forEach((d, i) => {
      const c = findCommit(p, d.commit);
      listBox.append(h('div', { class: 'item' },
        h('span', { class: 'pill ' + (i === 0 ? 'live' : '') }, [h('span', { class: 'dot' }), i === 0 ? 'Live' : 'Старий']),
        h('div', { class: 'meta' }, h('div', { class: 't' }, c ? c.msg : '—'),
          h('div', { class: 'muted sm' }, [h('code', { class: 'h' }, d.commit), ' · ' + ago(d.t)])),
        links[i] ? h('a', { class: 'btn sm', href: links[i], target: '_blank', rel: 'noopener' }, 'Відкрити') : null));
    });
    if (!rows.length) listBox.append(h('p', { class: 'muted sm' }, 'Деплоїв ще не було.'));
  }
  async function run() {
    if (deploying) return; deploying = true; deployBtn.setAttribute('disabled', ''); term.hidden = false; term.replaceChildren(); pill('build', 'Deploying…');
    const log = (t, cls) => { term.append(h('div', {}, [h('span', { class: 'arrow' }, cls ? '' : '==> '), h('span', { class: cls || '' }, t)])); term.scrollTop = term.scrollHeight; };
    try {
      await wait(350);
      const ch = changes(p);
      if (ch.length) { const c = commit(p, 'Deploy: ' + defaultMsg(ch)); log('Закомічено зміни (' + ch.length + '): ' + c.id); renderFiles(); await wait(350); }
      const head = p.commits[0];
      log('Деплой коміту ' + head.id + ' — ' + head.msg); await wait(450);
      log('Збираємо файли проєкту (' + Object.keys(head.files).length + ')'); await wait(450);
      log('Команда збірки не потрібна — статичний сайт'); await wait(400);
      const link = await makeLink(head.files, title(p));
      log('Створюємо посилання (' + link.length + ' символів)'); await wait(450);
      p.deploys.unshift({ id: rid(), commit: head.id, t: Date.now() }); p.deploys = p.deploys.slice(0, 20); p.updated = Date.now(); persist();
      log('Сайт активний. Деплой завершено.'); deploying = false; pill('live', 'Live · щойно');
    } catch (e) { deploying = false; pill('fail', 'Помилка'); log(String(e && e.message || e), 'err'); }
    deployBtn.removeAttribute('disabled'); refresh();
  }
  nameInp.addEventListener('input', () => { p.name = nameInp.value; $('#nameInput').value = nameInp.value; touch(); updateUrl(); clearTimeout(nameInp._t); nameInp._t = setTimeout(refresh, 250); });
  root.append(
    h('h3', {}, [h('span', { html: ic('up') }), 'Деплой', h('span', { class: 'pill' }, 'Static Site')]),
    h('div', { style: 'margin-top:6px' }, pillBox),
    h('label', {}, 'Назва сайту (у посиланні)'), nameInp,
    h('label', {}, 'Адреса сайту'), urlInp,
    h('div', { class: 'row' }, copyBtn, openA, shareBtn, dlBtn),
    h('div', { class: 'row' }, deployBtn), term,
    h('h4', {}, 'Деплої'), listBox,
    h('p', { class: 'muted sm', style: 'margin-top:14px' }, 'Сайт публікується як посилання, що містить усі файли, — окремий сервер не потрібен.'));
  showSheet(root); refresh();
}
$('#deployBtn').onclick = openDeploy;

/* ================= маршрути ================= */
async function route() {
  const m = location.hash.match(/^#\/([^\/]*)\/(.+)$/);
  if (m) {
    showView('viewer');
    try {
      const d = await unpack(m[2]);
      document.title = d.n || 'Сайт';
      setFrame('vframe', buildDoc(d.f, { console: false }));
      $('#badge').href = BASE;
    } catch (e) {
      setFrame('vframe', '<body style="font:16px sans-serif;padding:24px;background:#0d1117;color:#e6edf3">Не вдалося відкрити посилання. Воно пошкоджене або неповне.</body>');
    }
  } else { document.title = 'Clidex Editor'; showView('home'); renderHome(); }
}
$('#badgeX').onclick = e => { e.preventDefault(); e.stopPropagation(); $('#badge').hidden = true; };
addEventListener('popstate', () => { if (!$('#project').hidden || !location.hash) goHome(); });
addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
